name: Publicar jogo no GitHub Pages

on:
  push:
    branches:
      - main
      - homologaçãoblk
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar ferramentas de desenvolvimento
        run: python -m pip install -r requirements-dev.txt

      - name: Verificar dependências instaladas
        run: python -m pip check

      - name: Verificar sintaxe Python
        run: python -m compileall -q main.py classes tests tools teste

      - name: Verificar estilo e erros estaticos
        run: ruff check .

      - name: Executar testes
        run: python -m pytest

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Pygbag
        run: python -m pip install --require-hashes -r requirements-web.txt

      - name: Gerar versao web
        run: python -m pygbag --build .

      - name: Preparar artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web

  deploy:
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
